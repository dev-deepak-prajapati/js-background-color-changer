<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Backgroun Color Changer</title>
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <div class="container">
      <h1 class="heading">background color changer</h1>
      <div class="combaineInputBtn">
          <input id="inputColor" type="text" required value="white" placeholder="type here color name e.g. red , #d9fce4 , rgb(83, 141, 2)">
          <button id="applyColorBtn">Apply color</button>
          <button id="randomColorBtn">Random color</button>
      </div>
      <p class="colorValuePara">background color : <span id="colorValueName">white</span></p>
    </div>

    <script src="script.js"></script>
  </body>
</html>
